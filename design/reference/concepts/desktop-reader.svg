<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1350" viewBox="0 0 1440 1350"><rect x="0" y="0" width="1440" height="1350" rx="0" fill="#F7F7F2"/><rect x="0" y="76" width="1440" height="1" rx="0" fill="#D9DFD7"/><text x="42" y="49" fill="#202A24" font-size="26" font-family="DejaVu Sans,sans-serif" font-weight="bold">STMTS.</text><text x="1060" y="45" fill="#626D65" font-size="12" font-family="DejaVu Sans,sans-serif" font-weight="normal">A place for your perspective.</text><circle cx="1338" cy="38" r="18" fill="#E8EFE4"/><text x="1328.1" y="43.400000000000006" fill="#285C43" font-size="11.34" font-family="DejaVu Sans,sans-serif" font-weight="bold">KM</text><rect x="52" y="112" width="186" height="46" rx="10" fill="#E8EFE4"/><text x="76" y="141" fill="#285C43" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="bold">Home</text><text x="76" y="199" fill="#626D65" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="normal">Discover</text><text x="76" y="257" fill="#626D65" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="normal">Notifications</text><text x="76" y="315" fill="#626D65" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="normal">Saved</text><text x="76" y="373" fill="#626D65" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="normal">Profile</text><rect x="52" y="442" width="186" height="44" rx="10" fill="#285C43"/><text x="66" y="470" fill="#FFFFFF" font-size="12" font-family="DejaVu Sans,sans-serif" font-weight="bold">Write a statement</text><circle cx="82" cy="744" r="18" fill="#E8EFE4"/><text x="72.1" y="749.4" fill="#285C43" font-size="11.34" font-family="DejaVu Sans,sans-serif" font-weight="bold">KM</text><text x="112" y="741" fill="#202A24" font-size="12" font-family="DejaVu Sans,sans-serif" font-weight="bold">Kai Morgan</text><text x="112" y="760" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">@kaimorgan</text><rect x="1060" y="112" width="1" height="1" rx="0" fill="#D9DFD7"/><text x="1092" y="132" fill="#626D65" font-size="10" font-family="DejaVu Sans,sans-serif" font-weight="bold">FOLLOW YOUR CURIOSITY</text><text x="1092" y="181" fill="#202A24" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="bold">Design &amp; culture</text><text x="1092" y="203" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">Ideas for a considered world</text><rect x="1092" y="222" width="252" height="1" rx="0" fill="#D9DFD7"/><text x="1092" y="253" fill="#202A24" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="bold">Technology</text><text x="1092" y="275" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">Tools, people, possibilities</text><rect x="1092" y="294" width="252" height="1" rx="0" fill="#D9DFD7"/><text x="1092" y="325" fill="#202A24" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="bold">Everyday life</text><text x="1092" y="347" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">The details worth noticing</text><rect x="1092" y="366" width="252" height="1" rx="0" fill="#D9DFD7"/><text x="1092" y="397" fill="#202A24" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="bold">Arts &amp; words</text><text x="1092" y="419" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">A different way of seeing</text><rect x="1092" y="438" width="252" height="1" rx="0" fill="#D9DFD7"/><rect x="1092" y="476" width="252" height="208" rx="12" fill="#E8EFE4"/><text x="1112" y="512" fill="#202A24" font-size="23" font-family="Georgia,DejaVu Serif" font-weight="normal">Big thoughts.</text><text x="1112" y="540" fill="#202A24" font-size="23" font-family="Georgia,DejaVu Serif" font-weight="normal">Small beginnings.</text><text x="1112" y="588" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">You don’t need a finished idea</text><text x="1112" y="608" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">to start a good conversation.</text><text x="1112" y="651" fill="#285C43" font-size="12" font-family="DejaVu Sans,sans-serif" font-weight="normal">Make your statement ↗</text><text x="1092" y="731" fill="#626D65" font-size="10" font-family="DejaVu Sans,sans-serif" font-weight="normal">STMTS · Design concept v1.0</text><text x="340" y="130" fill="#626D65" font-size="12" font-family="DejaVu Sans,sans-serif" font-weight="normal">← Back to feed</text><text x="340" y="186" fill="#285C43" font-size="10" font-family="DejaVu Sans,sans-serif" font-weight="bold">DESIGN &amp; CULTURE</text><text x="340" y="245" fill="#202A24" font-size="48" font-family="Georgia,DejaVu Serif" font-weight="normal">The internet needs</text><text x="340" y="300" fill="#202A24" font-size="48" font-family="Georgia,DejaVu Serif" font-weight="normal">more quiet corners.</text><text x="340" y="341" fill="#626D65" font-size="21" font-family="Georgia,DejaVu Serif" font-weight="normal">A case for slower conversations, longer thoughts,</text><text x="340" y="370" fill="#626D65" font-size="21" font-family="Georgia,DejaVu Serif" font-weight="normal">and places that feel a little more human.</text><circle cx="358" cy="432" r="18" fill="#E8EFE4"/><text x="348.1" y="437.4" fill="#285C43" font-size="11.34" font-family="DejaVu Sans,sans-serif" font-weight="bold">AL</text><text x="388" y="427" fill="#202A24" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="bold">Alex Lin</text><text x="388" y="446" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">@alexlin · 2h ago</text><text x="340" y="474" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">November 8, 2026 · 4 min read</text><svg x="340" y="504" width="664" height="330" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice"><rect width="1200" height="675" fill="#E8EBDA"/><circle cx="870" cy="190" r="105" fill="#DB9E6E"/><path d="M0 405Q240 210 495 405T1200 350V675H0Z" fill="#9CAC8D"/><path d="M0 535Q300 325 625 490T1200 410V675H0Z" fill="#57765F"/><path d="M0 625Q280 440 605 605T1200 540V675H0Z" fill="#2C5140"/><path d="M735 675Q610 520 730 405" fill="none" stroke="#ECE7CC" stroke-width="12"/></svg><text x="340" y="858" fill="#626D65" font-size="10" font-family="DejaVu Sans,sans-serif" font-weight="normal">Some ideas need room to find their own path. Illustration for STMTS.</text><text x="340" y="914" fill="#202A24" font-size="18" font-family="Georgia,DejaVu Serif" font-weight="normal">We have become very good at filling the spaces between things.</text><text x="340" y="945" fill="#202A24" font-size="18" font-family="Georgia,DejaVu Serif" font-weight="normal">A spare minute becomes a scroll. A passing thought becomes a</text><text x="340" y="976" fill="#202A24" font-size="18" font-family="Georgia,DejaVu Serif" font-weight="normal">performance. There is always something new to react to.</text><text x="340" y="1050" fill="#202A24" font-size="29" font-family="Georgia,DejaVu Serif" font-weight="normal">Make room for the unfinished.</text><text x="340" y="1093" fill="#202A24" font-size="18" font-family="Georgia,DejaVu Serif" font-weight="normal">A quiet corner is not an empty place. It is somewhere we can bring</text><text x="340" y="1124" fill="#202A24" font-size="18" font-family="Georgia,DejaVu Serif" font-weight="normal">an idea before it has learned to speak in headlines. Somewhere a</text><text x="340" y="1155" fill="#202A24" font-size="18" font-family="Georgia,DejaVu Serif" font-weight="normal">conversation can be both small and meaningful.</text><rect x="340" y="1212" width="3" height="78" rx="0" fill="#285C43"/><text x="364" y="1237" fill="#285C43" font-size="23" font-family="Georgia,DejaVu Serif" font-weight="normal">What if we designed for the thought that</text><text x="364" y="1268" fill="#285C43" font-size="23" font-family="Georgia,DejaVu Serif" font-weight="normal">comes after the first reaction?</text></svg>