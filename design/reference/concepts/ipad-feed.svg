" font-size="14" font-family="DejaVu Sans,sans-serif" font-weight="normal">Discover</text><rect x="116" y="251" width="680" height="1" rx="0" fill="#D9DFD7"/><circle cx="134" cy="304" r="18" fill="#E8EFE4"/><text x="124.1" y="309.4" fill="#285C43" font-size="11.34" font-family="DejaVu Sans,sans-serif" font-weight="bold">AL</text><text x="164" y="299" fill="#202A24" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="bold">Alex Lin</text><text x="164" y="318" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">@alexlin · 2h ago</text><text x="116" y="369" fill="#202A24" font-size="29" font-family="Georgia,DejaVu Serif" font-weight="normal">The internet needs more quiet corners.</text><text x="116" y="410" fill="#626D65" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="normal">What happens when we make a little less noise, and leave a little</text><text x="116" y="435" fill="#626D65" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="normal">more space for ideas to take their shape?</text><svg x="116" y="470" width="680" height="382" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice"><rect width="1200" height="675" fill="#E8EBDA"/><circle cx="870" cy="190" r="105" fill="#DB9E6E"/><path d="M0 405Q240 210 495 405T1200 350V675H0Z" fill="#9CAC8D"/><path d="M0 535Q300 325 625 490T1200 410V675H0Z" fill="#57765F"/><path d="M0 625Q280 440 605 605T1200 540V675H0Z" fill="#2C5140"/><path d="M735 675Q610 520 730 405" fill="none" stroke="#ECE7CC" stroke-width="12"/></svg><text x="116" y="889" fill="#285C43" font-size="12" font-family="DejaVu Sans,sans-serif" font-weight="normal">Design &amp; culture</text><text x="596" y="889" fill="#285C43" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">Continue reading · 4 min</text><g transform="translate(116 924) scale(0.75)" fill="none" stroke="#626D65" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-4 5 2 10 8 15 6-5 12-10 8-15Z"/></g><text x="142" y="938" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">128</text><g transform="translate(216 924) scale(0.75)" fill="none" stroke="#626D65" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 5Z"/></g><text x="242" y="938" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">18</text><g transform="translate(316 924) scale(0.75)" fill="none" stroke="#626D65" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 3-3 3 3M7 4v13h10M20 17l-3 3-3-3M17 20V7h-4"/></g><text x="342" y="938" fill="#626D65" font-size="11" font-family="DejaVu Sans,sans-serif" font-weight="normal">9</text><rect x="116" y="968" width="680" height="1" rx="0" fill="#D9DFD7"/><text x="116" y="1030" fill="#202A24" font-size="25" font-family="Georgia,DejaVu Serif" font-weight="normal">A good idea rarely arrives fully formed.</text><text x="116" y="1080" fill="#626D65" font-size="17" font-family="Georgia,DejaVu Serif" font-weight="normal">Sometimes all it needs is a place to begin.</text></svg>