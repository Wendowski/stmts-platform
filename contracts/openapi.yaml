openapi: 3.1.0
info:
  title: STMTS initial read-only contract
  version: 0.1.0
paths:
  /v1/posts/{id}:
    get:
      operationId: getPost
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current public revision (development fixture only initially)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Neutral unavailable response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Post:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - summary
      - author
      - publishedAt
      - content
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 160
        summary:
          type: string
          maxLength: 280
        publishedAt:
          type: string
          format: date-time
        author:
          type: object
          required:
          - id
          - handle
          - displayName
          properties:
            id:
              type: string
              format: uuid
            handle:
              type: string
            displayName:
              type: string
        content:
          $ref: '#/components/schemas/Content'
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: object
          additionalProperties: false
          properties:
            body:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - message
                - sourceSpan
                properties:
                  message:
                    type: string
                  sourceSpan:
                    type: array
                    prefixItems:
                    - type: integer
                      minimum: 0
                    - type: integer
                      minimum: 0
                    items: false
                    minItems: 2
                    maxItems: 2
    Content:
      type: object
      additionalProperties: false
      required:
      - dialect
      - blocks
      - plainText
      - excerpt
      - readingMinutes
      - isShort
      - validationErrors
      properties:
        dialect:
          const: stmts-md/1
        blocks:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ContentDocumentBlock'
        plainText:
          type: string
        excerpt:
          type: string
          maxLength: 280
        readingMinutes:
          type: integer
          minimum: 1
        isShort:
          type: boolean
        validationErrors:
          type: array
          items:
            type: string
      description: stmts-md/1 canonical transport. Structural validation does not
        grant attachment access or replace parser resource limits.
    ContentText:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: text
        text:
          type: string
          maxLength: 50000
        children:
          type: array
          maxItems: 0
          items: false
    ContentCodeInline:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: codeInline
        text:
          type: string
          maxLength: 50000
        children:
          type: array
          maxItems: 0
          items: false
    ContentStrong:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: strong
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
    ContentEmphasis:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: emphasis
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
    ContentStrike:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: strike
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
    ContentLink:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - url
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: link
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentLinkChild'
        url:
          type: string
          pattern: ^(https?://[^/\s?#]+(?:[/?#][^\s]*)?|mailto:[^\s]+)$
    ContentSpan:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: span
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
    ContentParagraph:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: paragraph
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentHeading:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      - depth
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: heading
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
        depth:
          type: integer
          minimum: 1
          maximum: 6
    ContentList:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: list
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentListItem'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentOrderedList:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      - start
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: orderedList
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentListItem'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
        start:
          type: integer
          minimum: 0
          maximum: 999999999
    ContentQuote:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: quote
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentDocumentBlock'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentTable:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: table
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentTableSection'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentCode:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      - language
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: code
        text:
          type: string
          maxLength: 50000
        children:
          type: array
          maxItems: 0
          items: false
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
        language:
          type: string
          maxLength: 50000
    ContentRule:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: rule
        text:
          const: ''
        children:
          type: array
          maxItems: 0
          items: false
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentMedia:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      - attachmentId
      - mediaType
      - alt
      - decorative
      - caption
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: media
        text:
          const: ''
        children:
          type: array
          maxItems: 0
          items: false
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
        attachmentId:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        mediaType:
          enum:
          - image
          - video
        alt:
          type: string
          maxLength: 1000
        decorative:
          type: boolean
        caption:
          type: string
          maxLength: 500
    ContentItem:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: item
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentDocumentBlock'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentTaskItem:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      - checked
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: taskItem
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentDocumentBlock'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
        checked:
          type: boolean
    ContentTableHead:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: tableHead
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentRow'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentTableBody:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: tableBody
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentRow'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentRow:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: row
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentTableCell'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentHeaderCell:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: headerCell
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    ContentCell:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - text
      - children
      - sourceSpan
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          const: cell
        text:
          const: ''
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentInline'
        sourceSpan:
          description: Zero-based logical line range [startLine,endLine), end exclusive,
            in the LF-normalized parsing view. Nonempty accurate spans only; no unknown
            placeholders.
          type: array
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 1
          items: false
          minItems: 2
          maxItems: 2
    Block:
      oneOf:
      - $ref: '#/components/schemas/ContentText'
      - $ref: '#/components/schemas/ContentCodeInline'
      - $ref: '#/components/schemas/ContentStrong'
      - $ref: '#/components/schemas/ContentEmphasis'
      - $ref: '#/components/schemas/ContentStrike'
      - $ref: '#/components/schemas/ContentLink'
      - $ref: '#/components/schemas/ContentSpan'
      - $ref: '#/components/schemas/ContentParagraph'
      - $ref: '#/components/schemas/ContentHeading'
      - $ref: '#/components/schemas/ContentList'
      - $ref: '#/components/schemas/ContentOrderedList'
      - $ref: '#/components/schemas/ContentQuote'
      - $ref: '#/components/schemas/ContentTable'
      - $ref: '#/components/schemas/ContentCode'
      - $ref: '#/components/schemas/ContentRule'
      - $ref: '#/components/schemas/ContentMedia'
      - $ref: '#/components/schemas/ContentItem'
      - $ref: '#/components/schemas/ContentTaskItem'
      - $ref: '#/components/schemas/ContentTableHead'
      - $ref: '#/components/schemas/ContentTableBody'
      - $ref: '#/components/schemas/ContentRow'
      - $ref: '#/components/schemas/ContentHeaderCell'
      - $ref: '#/components/schemas/ContentCell'
    ContentInline:
      oneOf:
      - $ref: '#/components/schemas/ContentText'
      - $ref: '#/components/schemas/ContentCodeInline'
      - $ref: '#/components/schemas/ContentStrong'
      - $ref: '#/components/schemas/ContentEmphasis'
      - $ref: '#/components/schemas/ContentStrike'
      - $ref: '#/components/schemas/ContentLink'
      - $ref: '#/components/schemas/ContentSpan'
    ContentLinkChild:
      oneOf:
      - $ref: '#/components/schemas/ContentText'
      - $ref: '#/components/schemas/ContentCodeInline'
      - $ref: '#/components/schemas/ContentStrong'
      - $ref: '#/components/schemas/ContentEmphasis'
      - $ref: '#/components/schemas/ContentStrike'
      - $ref: '#/components/schemas/ContentSpan'
    ContentDocumentBlock:
      oneOf:
      - $ref: '#/components/schemas/ContentParagraph'
      - $ref: '#/components/schemas/ContentHeading'
      - $ref: '#/components/schemas/ContentList'
      - $ref: '#/components/schemas/ContentOrderedList'
      - $ref: '#/components/schemas/ContentQuote'
      - $ref: '#/components/schemas/ContentTable'
      - $ref: '#/components/schemas/ContentCode'
      - $ref: '#/components/schemas/ContentRule'
      - $ref: '#/components/schemas/ContentMedia'
    ContentListItem:
      oneOf:
      - $ref: '#/components/schemas/ContentItem'
      - $ref: '#/components/schemas/ContentTaskItem'
    ContentTableSection:
      oneOf:
      - $ref: '#/components/schemas/ContentTableHead'
      - $ref: '#/components/schemas/ContentTableBody'
    ContentTableCell:
      oneOf:
      - $ref: '#/components/schemas/ContentHeaderCell'
      - $ref: '#/components/schemas/ContentCell'
