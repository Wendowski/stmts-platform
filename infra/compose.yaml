services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: stmts
      POSTGRES_USER: stmts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:8.2.1
    ports: ["127.0.0.1:6379:6379"]
  broker:
    image: rabbitmq:4.1.4-management
    ports: ["127.0.0.1:5672:5672"]
volumes:
  postgres:
